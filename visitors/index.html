<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#140925"><title>RespiraRest | Guestbook</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
nav{flex-wrap:wrap;padding-block:12px}.introhead{padding:42px 0 22px;text-align:center}.introhead h1{font-size:clamp(36px,6vw,64px);margin:0}.panel{border:1px solid #bd8aff33;background:linear-gradient(145deg,#bd8aff18,#8d4bf005);border-radius:24px;padding:20px;margin-bottom:20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}.stats strong{display:block;color:var(--soft);font-size:30px}.stats span{font-size:13px;color:var(--muted)}#map{height:clamp(310px,49vw,530px);background:#140925;border-radius:16px;direction:ltr}.leaflet-tile-pane{filter:grayscale(1) invert(.88) hue-rotate(220deg) saturate(1.8) brightness(.85)}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#2c1747;color:var(--white)}.leaflet-popup-content{font-family:'IBM Plex Sans Arabic',sans-serif;overflow-wrap:anywhere}.columns{display:grid;grid-template-columns:1fr 1fr;gap:20px}label{display:block;color:var(--soft);margin:12px 0 4px}input,textarea,select{width:100%;font:inherit;color:var(--white);background:#140925aa;border:1px solid #bd8aff55;border-radius:10px;padding:10px}option{background:#140925}textarea{resize:vertical}fieldset{border:0;padding:0;margin:12px 0}.stars{display:flex;gap:5px;flex-wrap:wrap}.stars label{cursor:pointer;margin:0}.stars input{width:auto;accent-color:var(--purple)}.stars span{color:#bd8aff}.entry{border-bottom:1px solid #bd8aff33;padding:12px 0;overflow-wrap:anywhere}.entry p{white-space:pre-wrap;margin:5px 0}.entry small{color:var(--muted)}.check{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:13px}.check input{width:auto;margin-top:6px}.button{margin-top:12px}.hint{font-size:13px;color:var(--muted)}#msg{min-height:24px;color:var(--soft)}@media(max-width:700px){.columns{grid-template-columns:1fr}.panel{padding:14px}}
</style></head><body><header><nav class="wrap"><a class="brand" href="/"><i></i>RespiraRest</a><div class="links"><a href="/" data-ar="الرئيسية" data-en="Home"></a><button id="languageToggle">English</button></div></nav></header><main class="wrap"><section class="introhead"><span class="eyebrow">GLOBAL VISITOR MAP · RESPIRAREST</span><h1 data-ar="بصمات من حول العالم" data-en="Footprints around the world"></h1><p class="muted" data-ar="ابتكار يحمل أثرًا إنسانيًا… وبصمات تتجاوز الحدود." data-en="An innovation with human impact, leaving footprints beyond borders."></p></section><section class="panel"><div class="stats"><div><strong id="count">—</strong><span data-ar="الرسائل المنشورة" data-en="Published messages"></span></div><div><strong id="countries">—</strong><span data-ar="الدول" data-en="Countries"></span></div><div><strong id="avg">—</strong><span data-ar="متوسط التقييم / 5" data-en="Average rating / 5"></span></div></div><div id="map"></div><p class="hint" data-ar="اضغط على الخريطة لتحديد موقع تقريبي لمدينتك، وليس عنوانك الشخصي. العلامات الخضراء تمثل الرسائل المعتمدة." data-en="Tap the map to mark your approximate city, not your personal address. Green markers represent approved messages."></p></section><div class="columns"><section class="panel"><h2 data-ar="اترك بصمتك" data-en="Leave your mark"></h2><form id="form"><label for="name" data-ar="الاسم (اختياري)" data-en="Name (optional)"></label><input id="name" maxlength="80"><label for="country" data-ar="الدولة" data-en="Country"></label><select id="country" required></select><label for="city" data-ar="المدينة (اختياري)" data-en="City (optional)"></label><input id="city" maxlength="80"><p id="picked" class="hint" data-ar="حدد موقعًا تقريبيًا على الخريطة أعلاه." data-en="Choose an approximate location on the map above."></p><label for="role" data-ar="صفة الزائر" data-en="Visitor role"></label><select id="role"><option value="visitor" data-ar="زائر" data-en="Visitor"></option><option value="judge" data-ar="محكّم" data-en="Judge"></option><option value="researcher" data-ar="باحث" data-en="Researcher"></option><option value="health" data-ar="مختص صحي" data-en="Health professional"></option><option value="innovator" data-ar="مبتكر" data-en="Innovator"></option></select><label for="message" data-ar="رأيك ومقترحاتك حول RespiraRest" data-en="Your feedback about RespiraRest"></label><textarea id="message" required maxlength="1000" rows="4"></textarea><fieldset><legend data-ar="تقييم الابتكار (اختياري)" data-en="Innovation rating (optional)"></legend><div class="stars" id="stars"></div></fieldset><label class="check"><input id="consent" type="checkbox" required><span data-ar="أوافق على نشر رسالتي واسمي إن كتبته وموقعي التقريبي بعد المراجعة. لن أكتب معلومات صحية أو شخصية حساسة." data-en="I agree to publish my message, optional name and approximate location after review. I will not include sensitive personal or health information."></span></label><button class="button primary" type="submit" data-ar="أرسل بصمتك" data-en="Submit your footprint"></button><p id="msg" role="status"></p></form></section><section class="panel"><h2 data-ar="رسائل الزوار" data-en="Visitor messages"></h2><div id="entries"></div></section></div></main><footer class="wrap footer"><span>RespiraRest · Innovation with impact</span><a href="/">Nouf Khabti</a></footer><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/visitors/app.js"></script></body></html>
