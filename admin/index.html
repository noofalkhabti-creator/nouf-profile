<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>إدارة سجل RespiraRest</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/theme.css"><style>input{font:inherit;background:#140925;color:white;border:1px solid #bd8aff66;border-radius:10px;padding:10px;width:min(100%,420px)}article{border:1px solid #bd8aff33;padding:18px;border-radius:16px;margin:14px 0;overflow-wrap:anywhere}article p{white-space:pre-wrap}.button{margin:4px}#status{color:var(--soft)}</style></head><body><header><nav class="wrap"><a class="brand" href="/visitors/"><i></i>RespiraRest</a></nav></header><main class="wrap"><h2>لوحة إدارة سجل الزوار</h2><p class="muted">اعتماد الرسائل وإخفاؤها وحذفها وتصدير البيانات.</p><form id="login"><input id="token" type="password" required placeholder="رمز الإدارة" autocomplete="current-password"><button class="button primary">دخول / تحديث</button></form><p id="status"></p><button id="export" class="button" hidden>تصدير CSV (Excel)</button><div id="list"></div></main><script>
const $=id=>document.getElementById(id);let token='',rows=[];async function api(body){const r=await fetch('/api/admin',{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});if(!r.ok)throw Error();return r.json()}async function load(){try{rows=await api();$('status').textContent='عدد الرسائل: '+rows.length;$('export').hidden=false;$('list').replaceChildren();for(const r of rows){const a=document.createElement('article'),h=document.createElement('b'),p=document.createElement('p');h.textContent=(r.name||'زائر')+' · '+r.country+' · '+r.city+' · '+r.role+' · '+(r.rating||'—')+'/5 · '+(r.status==='approved'?'منشورة':'قيد المراجعة');p.textContent=r.message;a.append(h,p);for(const [action,label] of [[r.status==='approved'?'pending':'approved',r.status==='approved'?'إخفاء':'اعتماد ونشر'],['delete','حذف نهائي']]){const b=document.createElement('button');b.className='button';b.textContent=label;b.onclick=async()=>{if(action==='delete'&&!confirm('حذف الرسالة نهائيًا؟'))return;try{await api({id:r.id,action});await load()}catch{$('status').textContent='تعذر تنفيذ العملية'}};a.append(b)}$('list').append(a)}}catch{$('status').textContent='تعذر الدخول. تحقق من الرمز وربط قاعدة البيانات.';$('list').replaceChildren();$('export').hidden=true;rows=[]}}$('login').onsubmit=e=>{e.preventDefault();token=$('token').value;load()};$('export').onclick=()=>{const cols=['id','name','country','city','role','message','rating','lat','lng','status','created_at'];const cell=v=>{let s=String(v??'');if(/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'};const blob=new Blob(['\ufeff'+[cols.join(','),...rows.map(r=>cols.map(c=>cell(r[c])).join(','))].join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='respirarest-visitors.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></body></html>
